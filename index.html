

<!DOCTYPE html>
<html lang="en">
   <head>
      <title>Just Edit It - HTML CSS JS Editor</title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="description" content="Simple HTML, CSS, and JavaScript editor with live preview">
      <meta name="theme-color" content="#2563eb">
      <link rel="manifest" href="manifest.json">
      <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Ctext x='50' y='65' text-anchor='middle' fill='white' font-size='60' font-family='monospace'%3E%7B%7D%3C/text%3E%3C/svg%3E">
      <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Ctext x='50' y='65' text-anchor='middle' fill='white' font-size='60' font-family='monospace'%3E%7B%7D%3C/text%3E%3C/svg%3E">
      <link rel="stylesheet" href="default.css">
      <script src="main.js" defer></script>
      <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((registration) => {
                console.log('SW registered: ', registration);
              })
              .catch((registrationError) => {
                console.log('SW registration failed: ', registrationError);
              });
          });
        }
      </script>
   </head>
   <body>
      <main id="editor-body">
         <section class="editor-pane">
            <label for="editor-codearea" class="visually-hidden">Code Editor</label>
            <textarea 
               spellcheck="false" 
               id="editor-codearea" 
               class="editor-element" 
               placeholder="Your code here..."
               aria-label="HTML, CSS, and JavaScript code editor"
               rows="20"
               cols="50"></textarea>
         </section>
         <section class="editor-pane">
            <iframe 
               id="editor-preview" 
               class="editor-element"
               title="Live preview of your code"
               sandbox="allow-scripts allow-same-origin"
               loading="lazy"></iframe>
         </section>
         <nav id="editor-controls" class="editor-element" role="toolbar" aria-label="Editor controls">
            <div class="control-group">
               <label for="editor-font-size">Font size:</label>
               <button type="button" class="editor-button" aria-label="Decrease font size">-</button>
               <input 
                  id="editor-font-size" 
                  class="editor-text-input"  
                  value="20" 
                  type="number" 
                  min="8" 
                  max="72"
                  aria-label="Font size in pixels">
               <button type="button" class="editor-button" aria-label="Increase font size">+</button>
            </div>
            <div class="control-group">
               <span>Live preview:</span>
               <button type="button" id="live-checkbox" class="toggle-button" aria-pressed="false" aria-label="Toggle live preview">✕</button>
            </div>
            <div class="control-group">
               <button type="button" class="editor-button" aria-label="Load sample page">Sample Page</button>
               <button type="button" class="editor-button" aria-label="Save code as HTML file">Save Code</button>
            </div>
         </nav>
      </main>
   </body>
</html>
